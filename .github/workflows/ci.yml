name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Content guardrails
        run: node tools/check-content.mjs

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: node tools/check-bundle.mjs

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start preview server
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat preview.log
          exit 1

      - name: Smoke test
        run: node tools/smoke.mjs http://localhost:4173/
