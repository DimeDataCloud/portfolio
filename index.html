<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Christian Dixon, Applied AI &amp; Machine Learning Engineer</title>
  <meta name="description" content="__DESCRIPTION__" />
  <link rel="canonical" href="https://portfolio.dimedata.cloud/" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Christian Dixon, Applied AI &amp; Machine Learning Engineer" />
  <meta property="og:description" content="__DESCRIPTION__" />
  <meta property="og:url" content="https://portfolio.dimedata.cloud/" />
  <meta property="og:image" content="https://portfolio.dimedata.cloud/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Christian Dixon, Applied AI &amp; Machine Learning Engineer" />

  <meta name="twitter:image" content="https://portfolio.dimedata.cloud/og.png" />
  <meta name="theme-color" content="#0a0a0a" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0a'/%3E%3Ccircle cx='22' cy='24' r='5' fill='%232f80ff'/%3E%3Ccircle cx='44' cy='20' r='3.5' fill='%23fafafa'/%3E%3Ccircle cx='40' cy='44' r='4.5' fill='%23fafafa'/%3E%3Ccircle cx='18' cy='46' r='3' fill='%232f80ff'/%3E%3Cpath d='M22 24L44 20M44 20L40 44M40 44L18 46M18 46L22 24M22 24L40 44' stroke='%23fafafa' stroke-opacity='.5' stroke-width='1.5'/%3E%3C/svg%3E" />

  <!--JSON_LD-->

  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#project-list">Skip to projects</a>

  <!-- Loader / entry gate -->
  <div class="loader" id="loader" aria-hidden="false">
    <canvas class="loader-mark" id="loader-mark" width="220" height="220" aria-hidden="true"></canvas>
    <p class="loader-line" id="loader-line">applied ai and machine learning engineer, nashville</p>
    <div class="loader-progress mono" id="loader-progress" aria-hidden="true">00</div>
    <div class="loader-enter" id="loader-enter" hidden>
      <button class="enter-btn" id="enter-sound" type="button">enter with sound</button>
      <button class="enter-alt" id="enter-quiet" type="button">enter without sound</button>
    </div>
  </div>

  <!-- WebGL scene -->
  <canvas class="webgl" id="webgl" aria-hidden="true"></canvas>

  <!-- Fixed chrome -->
  <header>
    <a class="logo" id="logo" href="/" aria-label="Christian Dixon, home">
      <svg viewBox="0 0 64 64" width="52" height="52" aria-hidden="true">
        <circle cx="22" cy="24" r="5" fill="#2f80ff"/>
        <circle cx="44" cy="20" r="3.5" fill="#fafafa"/>
        <circle cx="40" cy="44" r="4.5" fill="#fafafa"/>
        <circle cx="18" cy="46" r="3" fill="#2f80ff"/>
        <path d="M22 24L44 20M44 20L40 44M40 44L18 46M18 46L22 24M22 24L40 44" stroke="#fafafa" stroke-opacity=".5" stroke-width="1.5"/>
      </svg>
      <span class="logo-tag" aria-hidden="true">christian dixon</span>
    </a>

    <div class="mode-switch" id="mode-switch" role="group" aria-label="Site mode">
      <button class="mode-btn active" id="mode-motion" type="button" aria-pressed="true" aria-label="Motion">
        <span class="mode-label"><span aria-hidden="true">Motion</span><span aria-hidden="true">Motion</span></span>
      </button>
      <span class="mode-dot" aria-hidden="true"></span>
      <button class="mode-btn" id="mode-sound" type="button" aria-pressed="false" aria-label="Sound">
        <span class="mode-label"><span aria-hidden="true">Sound</span><span aria-hidden="true">Sound</span></span>
      </button>
    </div>

    <button class="menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="menu-panel">menu</button>
  </header>

  <!-- Menu panel: projects, About, email, and the two social links from contact.links -->
  <nav class="menu-panel" id="menu-panel" aria-hidden="true" inert aria-label="Site menu">
    <ul class="menu-links" id="menu-links"><!-- populated by JS from data --></ul>
    <button class="menu-about-link" id="menu-about" type="button">About</button>
    <div class="menu-footer">
      <a href="mailto:__EMAIL__" class="menu-mail" id="menu-mail">__EMAIL__</a>
      <div class="menu-socials" id="menu-socials"><!-- populated by JS from contact.links --></div>
    </div>
    <button class="menu-close" id="menu-close" type="button" aria-label="Close menu">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 2l12 12M14 2L2 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </nav>

  <!-- Main content: real HTML for SEO (generated at build), enhanced by JS -->
  <main id="main">
    <h1 class="site-title visually-hidden">Christian Dixon, Applied AI &amp; Machine Learning Engineer</h1>
    <!--STATIC_CONTENT-->
  </main>

  <!-- Project detail overlay: case study -->
  <section class="detail" id="detail" aria-hidden="true" inert role="dialog" aria-modal="true" aria-labelledby="detail-title">
    <div class="detail-panel" id="detail-panel">
      <button class="detail-close" id="detail-close" type="button" aria-label="Close project">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 2l12 12M14 2L2 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    <div class="detail-inner" id="detail-inner">
      <div class="detail-top">
        <span class="detail-index mono" id="detail-index"></span>
        <span class="detail-status" id="detail-status"><span class="status-dot" aria-hidden="true"></span><span id="detail-status-text"></span></span>
      </div>
      <h2 class="detail-title" id="detail-title"></h2>
      <p class="detail-desc" id="detail-desc"></p>
      <div class="detail-metrics" id="detail-metrics"></div>
      <div class="detail-case" id="detail-case"></div>
      <ul class="detail-stack mono" id="detail-stack" aria-label="Stack"></ul>
      <div class="detail-links" id="detail-links"></div>
    </div>
    </div>
  </section>

  <!-- Profile overlay: rendered from src/data/profile.js -->
  <section class="about" id="about" aria-hidden="true" inert role="dialog" aria-modal="true" aria-label="Profile">
    <div class="about-panel" id="about-panel">
      <button class="about-close" id="about-close" type="button" aria-label="Close profile">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 2l12 12M14 2L2 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="about-inner" id="about-inner">
        <div class="about-body" id="about-body"></div>
      </div>
    </div>
  </section>

  <!-- Sound toggle -->
  <button class="sound-btn" id="sound-btn" type="button" aria-pressed="false" aria-label="Toggle sound">
    <svg class="icon-sound-on" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 6v4h3l4 3V3L5 6H2z" fill="currentColor"/><path d="M11.5 5.5a3.5 3.5 0 010 5M13 3.5a6 6 0 010 9" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>
    <svg class="icon-sound-off" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" hidden><path d="M2 6v4h3l4 3V3L5 6H2z" fill="currentColor"/><path d="M11 6l4 4M15 6l-4 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
  </button>

  <footer class="foot" id="foot">
    <span class="status-chip">Dime Data</span>
  </footer>
</body>
</html>
